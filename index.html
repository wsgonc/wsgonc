<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link type="image/png" href="//ssl.gstatic.com/classroom/favicon.png" rel="icon">
  <title>Home - Classroom</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }

    #homeButton {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 9999;
      padding: 10px 16px;
      border: 0;
      border-radius: 8px;
      background: #467daa;
      color: rgb(241, 241, 241);
      font: 600 14px Arial, sans-serif;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .25);
    }

    #homeButton:hover {
      background: #2772a0;
    }

    #youtubeButton {
      position: fixed;
      top: 12px;
      left: 105px;
      z-index: 9999;
      padding: 10px 16px;
      border: 0;
      border-radius: 8px;
      background: #c4302b;
      color: white;
      font: 600 14px Arial, sans-serif;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .25);
    }

    #youtubeButton:hover {
      background: #a52521;
    }

    #searchPanel {
      display: none;
      position: fixed;
      top: 60px;
      left: 12px;
      z-index: 9998;
      width: 420px;
      max-height: 80vh;
      overflow-y: auto;
      padding: 15px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, .3);
    }

    #searchBox {
      display: flex;
      gap: 8px;
    }

    #searchInput {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }

    #searchButton {
      padding: 10px 14px;
      border: 0;
      border-radius: 6px;
      background: #c4302b;
      color: white;
      cursor: pointer;
    }

    #results {
      margin-top: 12px;
    }

    .result {
      display: flex;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid #ddd;
      cursor: pointer;
    }

    .result:hover {
      background: #f2f2f2;
    }

    .thumbnail {
      width: 120px;
      height: 68px;
      object-fit: cover;
      border-radius: 5px;
    }

    .resultTitle {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.3;
    }

    #status {
      margin-top: 10px;
      font-size: 13px;
      color: #666;
    }
  </style>
</head>

<body>

  <button id="homeButton" onclick="goHome()">Home</button>
  <button id="youtubeButton" onclick="toggleSearch()">YouTube Search</button>

  <div id="searchPanel">
    <div id="searchBox">
      <input
        id="searchInput"
        type="text"
        placeholder="Search YouTube..."
        onkeydown="if(event.key === 'Enter') searchYouTube()"
      >

      <button id="searchButton" onclick="searchYouTube()">
        Search
      </button>
    </div>

    <div id="status"></div>
    <div id="results"></div>
  </div>

  <iframe
    id="siteFrame"
    src="https://google.com/search?igu=1"
    title="Embedded website">
  </iframe>

  <script>

    const YOUTUBE_API_KEY = "AIzaSyAIf7LFhVAjaxDgIXKvZ9UP7_GdW-RP8-4";

    const HOME_URL = "https://mail.google.com/mail/u/0?igu=1";



    function goHome() {
      document.getElementById("siteFrame").src = HOME_URL;

      document.getElementById("searchPanel").style.display = "none";
    }



    function toggleSearch() {
      const panel = document.getElementById("searchPanel");

      if (panel.style.display === "block") {
        panel.style.display = "none";
      } else {
        panel.style.display = "block";
        document.getElementById("searchInput").focus();
      }
    }



    async function searchYouTube() {

      const query = document.getElementById("searchInput").value.trim();
      const results = document.getElementById("results");
      const status = document.getElementById("status");

      if (!query) {
        status.textContent = "Enter something to search.";
        return;
      }

      if (YOUTUBE_API_KEY === "YOUR_API_KEY_HERE") {
        status.textContent = "Add your YouTube API key to the HTML first.";
        return;
      }

      status.textContent = "Searching...";
      results.innerHTML = "";

      try {

        const url =
          "https://www.googleapis.com/youtube/v3/search" +
          "?part=snippet" +
          "&type=video" +
          "&maxResults=10" +
          "&q=" + encodeURIComponent(query) +
          "&key=" + encodeURIComponent(YOUTUBE_API_KEY);

        const response = await fetch(url);
        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error?.message || "YouTube API request failed.");
        }

        if (!data.items || data.items.length === 0) {
          status.textContent = "No videos found.";
          return;
        }

        status.textContent = "";

        data.items.forEach(video => {

          const videoId = video.id.videoId;
          const title = video.snippet.title;
          const thumbnail = video.snippet.thumbnails.medium.url;

          const result = document.createElement("div");
          result.className = "result";

          result.innerHTML = `
            <img class="thumbnail" src="${thumbnail}" alt="">
            <div class="resultTitle">${escapeHTML(title)}</div>
          `;

          result.onclick = function() {
            playVideo(videoId);
          };

          results.appendChild(result);
        });

      } catch (error) {
        console.error(error);
        status.textContent = "Search error: " + error.message;
      }
    }



    function playVideo(videoId) {

      const embedURL =
        "https://www.youtube.com/embed/" +
        encodeURIComponent(videoId);

      document.getElementById("siteFrame").src = embedURL;

      document.getElementById("searchPanel").style.display = "none";
    }



    function escapeHTML(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }
  </script>

</body>
</html>
